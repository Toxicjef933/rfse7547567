name: Compile exp13 RK3588 FP16
on:
  push:
    paths:
      - '.github/workflows/exp13-compile.yml'
  workflow_dispatch:
jobs:
  convert:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install system and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ca-certificates curl libglib2.0-0 libgl1 libgomp1
          python -m pip install --upgrade pip wheel
          python -m pip install 'setuptools==70.3.0'
          python -m pip install 'numpy<=1.26.4' 'protobuf>=4.21.6,<=4.25.4' psutil ruamel.yaml scipy tqdm opencv-python-headless fast-histogram 'onnx==1.16.1' onnxruntime
          python -m pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps 'rknn-toolkit2==2.3.2'
      - name: Compile RKNN FP16 for RK3588
        env:
          MODEL_URL: 'https://cdn.discordapp.com/attachments/1562737567256944750/1562737569236516925/exp-13.onnx?ex=6adbbd06&is=6ada6b86&hm=2cba33637f02352bea83a11a39ec58bec5cdb1b8dbdbaa9deae6f42935edd05c&'
          MODEL_NAME: exp-13.onnx
        run: |
          sudo mkdir -p /work /out
          sudo chmod 777 /work /out
          curl -fL --retry 2 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/156.0.0.0 Safari/537.36" -H "Referer: https://discord.com/" "$MODEL_URL" -o /work/exp13_preloaded.onnx
          test "$(stat -c%s /work/exp13_preloaded.onnx)" = "18955035"
          echo "EXPECTED_HASH 0f002339e7bd2339786d84b276f6a179eb8835689bdf7032bc24c6d31fe158d3"
          sha256sum /work/exp13_preloaded.onnx
          curl -fsSL https://raw.githubusercontent.com/Toxicjef933/rfse7547567/main/convert_defier_generic.py -o /work/convert.py
          MODEL_URL=file:///work/exp13_preloaded.onnx python /work/convert.py
      - name: Upload RKNN artifact
        uses: actions/upload-artifact@v4
        with:
          name: exp-13_RK3588_FP16
          path: /out/exp-13_RK3588_FP16.rknn
          retention-days: 7
          if-no-files-found: error
